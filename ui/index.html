<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIamba OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wallpaper"></div>

  <!-- ============================================================
       MENU BAR
       ============================================================ -->
  <header class="menubar">
    <div class="menubar-left">
      <button class="brand-btn" id="brand-btn" type="button"
              aria-haspopup="true" title="Меню SIamba OS">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7dd3fc"/>
              <stop offset="1" stop-color="#c084fc"/>
            </linearGradient>
          </defs>
          <path d="M6 3 H18 A3 3 0 0 1 21 6 V18 A3 3 0 0 1 18 21 H6 A3 3 0 0 1 3 18 V6 A3 3 0 0 1 6 3 Z"
                fill="url(#logoGrad)"/>
          <text x="12" y="16.5" text-anchor="middle"
                font-size="12" font-weight="700" fill="#0a0a14"
                font-family="system-ui, sans-serif">S</text>
        </svg>
      </button>
      <span class="active-app-name" id="active-app-name">SIamba OS</span>
    </div>

    <div class="menubar-center">
      <span id="clock-date">—</span>
      <span id="clock-time">--:--:--</span>
    </div>

    <div class="menubar-right">
      <button class="indicator" id="wifi-btn" type="button" title="Wi-Fi" aria-haspopup="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="0.9" fill="currentColor" stroke="none"/>
        </svg>
      </button>

      <button class="indicator" id="vol-btn" type="button" title="Звук" aria-haspopup="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>

      <div class="indicator" title="Батарея">
        <svg width="26" height="13" viewBox="0 0 28 14" aria-hidden="true">
          <rect x="0.5" y="0.5" width="22" height="13" rx="3.5"
                fill="none" stroke="currentColor" stroke-opacity="0.55"/>
          <rect class="battery-fill" x="2" y="2" width="14" height="10"
                rx="2" fill="currentColor"/>
          <rect x="24" y="4.5" width="2" height="5" rx="1"
                fill="currentColor" fill-opacity="0.55"/>
        </svg>
        <span class="battery-text" id="battery-text">—</span>
      </div>
    </div>
  </header>

  <!-- ============================================================
       POPOVERS (fixed, вне backdrop-filter контекста menubar)
       ============================================================ -->
  <div class="popover" id="brand-menu" hidden>
    <div class="popover-title">SIamba OS</div>
    <div class="sep"></div>
    <button class="menu-item" data-action="settings" type="button">Система…</button>
    <button class="menu-item" data-action="about"    type="button">О системе</button>
    <div class="sep"></div>
    <button class="menu-item" data-action="logout" type="button">Выйти из системы…</button>
    <button class="menu-item" data-action="reboot"   type="button">Перезагрузить…</button>
    <button class="menu-item danger" data-action="shutdown" type="button">Выключить…</button>
  </div>

  <div class="popover" id="wifi-popover" hidden>
    <div class="popover-header">
      <span>Wi-Fi</span>
      <label class="switch">
        <input type="checkbox" id="wifi-toggle">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
    <div class="popover-sub" id="wifi-status">—</div>
    <div class="sep"></div>
    <div class="wifi-list" id="wifi-list"></div>
  </div>

  <div class="popover" id="vol-popover" hidden>
    <div class="popover-header"><span>Звук</span></div>
    <div class="volume-row">
      <button class="icon-btn" id="mute-btn" type="button" title="Mute" data-muted="false">
  <svg class="icon-vol-on" width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
  </svg>
  <svg class="icon-vol-off" width="20" height="20" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round">
    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
    <line x1="22" y1="9" x2="16" y2="15"/>
    <line x1="16" y1="9" x2="22" y2="15"/>
  </svg>
</button>
      <input type="range" id="volume-slider" min="0" max="100" step="1" value="50">
      <span class="volume-label" id="volume-label">50%</span>
    </div>
  </div>

  <!-- ============================================================
       DOCK
       ============================================================ -->
  <!-- Док рендерится полностью из JS -->
<div class="dock" id="dock"></div>

<!-- ============================================================
     LAUNCHPAD
     ============================================================ -->
<div class="launchpad-overlay" id="launchpad-overlay" aria-hidden="true">
  <div class="launchpad-grid" id="launchpad-grid"></div>
</div>

<!-- ============================================================
     CONTEXT MENU (общий для дока и Launchpad)
     ============================================================ -->
<div class="context-menu" id="context-menu" hidden>
  <div id="context-menu-items"></div>
</div>

  <!-- ============================================================
     SPOTLIGHT (Ctrl+Space)
     ============================================================ -->
<div class="spotlight-overlay" id="spotlight-overlay" aria-hidden="true">
  <div class="spotlight" role="dialog" aria-label="Поиск приложений">
    <div class="spotlight-input-wrap">
      <svg class="spotlight-search-icon" width="18" height="18"
           viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="spotlight-input"
             placeholder="Поиск приложений…"
             autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false">
    </div>
    <div class="spotlight-results" id="spotlight-results"></div>
    <div class="spotlight-hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> навигация</span>
      <span><kbd>↵</kbd> открыть</span>
      <span><kbd>esc</kbd> закрыть</span>
    </div>
  </div>
</div>

  <script src="app.js"></script>
</body>
</html>
